# Stylo production stack on one server (VPS):
#   caddy   → HTTPS certificates (Let's Encrypt) automatically, ports 80/443
#   app     → API + both websites (built from ../Dockerfile)
#   db      → PostgreSQL 16 (data in a named volume)
#   backup  → daily pg_dump, kept 14 days / 8 weeks / 6 months in ./backups
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose up -d --build
name: stylo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stylo
      POSTGRES_USER: stylo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylo -d stylo"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://stylo:${POSTGRES_PASSWORD}@db:5432/stylo
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: stylo
      POSTGRES_USER: stylo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
      TZ: Africa/Tripoli
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
