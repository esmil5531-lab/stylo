# Stylo production stack on one server (VPS):
#   caddy   → HTTPS certificates (Let's Encrypt) automatically, ports 80/443
#   app     → API + both websites (built from ../Dockerfile)
#   db      → PostgreSQL 16 (data in a named volume)
#   backup  → daily: database + photos in ONE encrypted file, kept in ./backups and copied
#             off-site (BACKUP_S3_*); a restore test every week (docs/BACKUP.md)
#
#   cp .env.production.example .env.production   # fill it in
#   docker compose up -d --build
name: stylo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stylo
      POSTGRES_USER: stylo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylo -d stylo"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://stylo:${POSTGRES_PASSWORD}@db:5432/stylo
      TRUST_PROXY: "true"
    volumes:
      # Photos uploaded from the back office (MEDIA_STORAGE=local). Back it up with the database.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    build:
      context: ..
      dockerfile: Dockerfile
      target: backup
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://stylo:${POSTGRES_PASSWORD}@db:5432/stylo
      BACKUP_DIR: /backups
      UPLOADS_DIR: /app/uploads
      TZ: Africa/Tripoli
    volumes:
      - ./backups:/backups
      # The photos, read-only: backed up in the same file as the database.
      - uploads:/app/uploads:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
